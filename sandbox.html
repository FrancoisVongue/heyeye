<!doctype html><html><head><meta charset="utf-8"><title>Eye Sandbox</title>
<style>
 body{font:16px system-ui;margin:0;background:#f4f4f2;color:#111}
 #bar{background:#222;color:#fff;padding:10px 16px;font-weight:600}
 #log{position:fixed;right:0;top:0;width:320px;height:100%;background:#111;color:#0f0;font:13px monospace;padding:10px;overflow:auto;white-space:pre-wrap}
 #box{position:absolute;left:80px;top:120px;width:120px;height:120px;background:#3b82f6;color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;font-weight:700}
 #dz{position:absolute;left:420px;top:120px;width:200px;height:200px;border:3px dashed #888;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#888}
 #dz.hit{border-color:#16a34a;background:#dcfce7;color:#16a34a}
 #dbl{position:absolute;left:80px;top:300px;width:200px;height:70px;background:#e5e7eb;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;user-select:none}
 #ta{position:absolute;left:80px;top:400px;width:420px;height:90px;font:15px monospace;padding:8px}
 #scroller{position:absolute;left:80px;top:520px;width:420px;height:180px;overflow:auto;background:#fff;border:1px solid #ccc}
 .row{padding:12px;border-bottom:1px solid #eee}
 #menu{position:absolute;display:none;background:#fff;border:1px solid #999;box-shadow:0 4px 12px #0003;padding:6px 0;border-radius:6px}
 #menu div{padding:6px 18px;cursor:pointer}#menu div:hover{background:#eee}
 #rz{position:absolute;left:560px;top:400px;width:200px;height:90px;background:#fde68a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
</style></head><body>
<div id="bar">🧪 Eye Sandbox — тренировка рук (drag/click/dblclick/scroll/type/rightclick)</div>
<div id="box">DRAG&nbsp;ME</div>
<div id="dz">сюда</div>
<div id="dbl">double-click me (0)</div>
<textarea id="ta" placeholder="печатай сюда..."></textarea>
<div id="scroller"></div>
<div id="rz">right-click me</div>
<div id="menu"><div>Пункт 1</div><div>Инспектировать</div><div>Пункт 3</div></div>
<div id="log">события:\n</div>
<script>
 const log=(m)=>{const L=document.getElementById('log');L.textContent+=m+"\n";L.scrollTop=L.scrollHeight;window.__last=m};
 // scroller items
 const sc=document.getElementById('scroller');for(let i=1;i<=40;i++){const d=document.createElement('div');d.className='row';d.textContent='строка '+i;sc.appendChild(d)}
 sc.addEventListener('scroll',()=>log('scroll top='+Math.round(sc.scrollTop)));
 // drag box (pointer-based → CDP mouse двигает естественно)
 const box=document.getElementById('box'),dz=document.getElementById('dz');let drag=false,ox=0,oy=0;
 box.addEventListener('mousedown',e=>{drag=true;ox=e.clientX-box.offsetLeft;oy=e.clientY-box.offsetTop;box.style.cursor='grabbing';log('mousedown box')});
 window.addEventListener('mousemove',e=>{if(!drag)return;box.style.left=(e.clientX-ox)+'px';box.style.top=(e.clientY-oy)+'px'});
 window.addEventListener('mouseup',e=>{if(!drag)return;drag=false;box.style.cursor='grab';
   const b=box.getBoundingClientRect(),d=dz.getBoundingClientRect();const hit=b.left<d.right&&b.right>d.left&&b.top<d.bottom&&b.bottom>d.top;
   dz.classList.toggle('hit',hit);log('drop box @'+Math.round(box.offsetLeft)+','+Math.round(box.offsetTop)+(hit?' ✅ В ЗОНЕ':''))});
 // double click
 let dc=0;const dbl=document.getElementById('dbl');dbl.addEventListener('dblclick',()=>{dc++;dbl.textContent='double-click me ('+dc+')';dbl.style.background='#bbf7d0';log('dblclick! счётчик='+dc)});
 // textarea
 document.getElementById('ta').addEventListener('input',e=>log('печать: "'+e.target.value.slice(-30)+'"'));
 // right click menu
 const rz=document.getElementById('rz'),menu=document.getElementById('menu');
 rz.addEventListener('contextmenu',e=>{e.preventDefault();menu.style.display='block';menu.style.left=e.clientX+'px';menu.style.top=e.clientY+'px';log('right-click → меню открыто')});
 window.addEventListener('click',()=>menu.style.display='none');
 log('готово, жду действий');
</script></body></html>
